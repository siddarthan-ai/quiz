<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroX Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00f2ff;
      --primary-dark: #00c2cc;
      --accent: #ff2e63;
      --bg-dark: #0a0a1a;
      --bg-card: #12122a;
      --bg-card-hover: #1a1a3a;
      --text: #e0e0ff;
      --text-dim: #8888aa;
      --correct: #00e676;
      --wrong: #ff5252;
      --teacher: #ff2e63;
      --student: #00f2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .container {
      max-width: 750px;
      width: 100%;
      background: var(--bg-card);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(0, 242, 255, 0.08), 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid rgba(0, 242, 255, 0.1);
    }

    /* Header / Logo */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 28px;
      background: linear-gradient(90deg, rgba(0,242,255,0.05), transparent);
      border-bottom: 1px solid rgba(0,242,255,0.08);
      flex-wrap: wrap;
      gap: 14px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      box-shadow: 0 0 15px rgba(0,242,255,0.3);
    }
    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    /* Toggle Switch */
    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.03);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .mode-label {
      font-size: 11px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      font-family: 'Orbitron', sans-serif;
    }
    .mode-label.active {
      background: var(--student);
      color: #000;
      box-shadow: 0 0 12px rgba(0,242,255,0.4);
    }
    .mode-label.teacher-active {
      background: var(--teacher);
      color: #fff;
      box-shadow: 0 0 12px rgba(255,46,99,0.4);
    }

    /* Screens */
    .screen { padding: 36px 32px; text-align: center; }
    .screen h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0,242,255,0.2);
    }
    .screen p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      padding: 14px 40px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: #000;
      border: none;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0,242,255,0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0,242,255,0.4);
    }

    /* Progress */
    .progress-wrap {
      padding: 0 32px;
      margin-top: 20px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.5s ease;
      box-shadow: 0 0 10px rgba(0,242,255,0.3);
    }
    .question-counter {
      text-align: right;
      padding: 10px 32px 0;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }

    /* Question Card */
    .question-card {
      padding: 20px 32px 32px;
    }
    .question-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
      color: var(--text);
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      padding: 14px 18px;
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: var(--bg-card-hover);
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      text-align: left;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text);
    }
    .option-btn:hover:not(.disabled) {
      border-color: var(--primary);
      background: rgba(0,242,255,0.06);
      transform: translateX(4px);
    }
    .option-btn.correct {
      border-color: var(--correct);
      background: rgba(0,230,118,0.1);
      color: var(--correct);
      font-weight: 600;
    }
    .option-btn.wrong {
      border-color: var(--wrong);
      background: rgba(255,82,82,0.1);
      color: var(--wrong);
    }
    .option-btn.disabled { cursor: default; opacity: 0.6; }
    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: 'Orbitron', sans-serif;
    }
    .option-btn.correct .option-letter { background: var(--correct); color: #000; }
    .option-btn.wrong .option-letter { background: var(--wrong); color: #fff; }

    /* Feedback */
    .feedback-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.7;
      display: none;
      border-left: 3px solid transparent;
    }
    .feedback-box.show {
      display: block;
      animation: slideIn 0.35s ease;
    }
    .feedback-box.correct-feedback {
      background: rgba(0,230,118,0.08);
      border-left-color: var(--correct);
    }
    .feedback-box.wrong-feedback {
      background: rgba(255,82,82,0.08);
      border-left-color: var(--wrong);
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .next-btn {
      margin-top: 18px;
      padding: 12px 30px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      float: right;
      transition: all 0.3s;
    }
    .next-btn:hover { box-shadow: 0 0 15px rgba(0,242,255,0.3); }
    .clearfix::after { content: ""; display: table; clear: both; }

    /* Results */
    .score-display { padding: 40px 30px; }
    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      font-weight: 700;
      box-shadow: 0 0 50px rgba(0,242,255,0.25);
    }
    .score-message {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .score-sub {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 28px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <img src="logo.png" class="logo-img" alt="NeuroX Logo" onerror="this.style.display='none';this.nextElementSibling.style.marginLeft='0'">
      <div class="logo-text">NeuroX</div>
    </div>
    <div class="mode-toggle">
      <div class="mode-label active" id="label-student" onclick="setMode('student')">STUDENT</div>
      <div class="mode-label" id="label-teacher" onclick="setMode('teacher')">TEACHER</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="quiz-start" class="screen">
    <h1>AI Knowledge Quiz</h1>
    <p id="start-desc">Test your AI knowledge with 15 medium-level questions. Options are shuffled every time!</p>
    <button class="btn" onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-game" style="display:none;">
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>
    </div>
    <div class="question-counter" id="question-counter">Question 1 / 15</div>
    <div class="question-card">
      <div class="question-text" id="question-text"></div>
      <div class="options-list" id="options-list"></div>
      <div class="feedback-box" id="feedback-box">
        <div class="feedback-title" id="feedback-title"></div>
        <div id="feedback-text"></div>
      </div>
      <div class="clearfix">
        <button class="next-btn" id="next-btn" style="display:none;" onclick="nextQuestion()">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="quiz-end" style="display:none;">
    <div class="score-display">
      <div class="score-circle" id="score-circle">0/15</div>
      <div class="score-message" id="score-message">Quiz Complete!</div>
      <div class="score-sub" id="score-sub">Here is how you did</div>
      <button class="btn" onclick="restartQuiz()">Try Again</button>
    </div>
  </div>
</div>

<script>
  // ==================== QUESTION BANKS ====================
  const studentQuestions = [
    {
      q: "What does 'AI' stand for?",
      options: ["Artificial Intelligence", "Automated Interface", "Advanced Integration", "Algorithmic Input"],
      correct: 0,
      explanation: "AI stands for Artificial Intelligence — the simulation of human intelligence processes by computer systems."
    },
    {
      q: "Which company created ChatGPT?",
      options: ["Google", "Microsoft", "OpenAI", "Meta"],
      correct: 2,
      explanation: "ChatGPT was developed by OpenAI, an AI research company founded in 2015."
    },
    {
      q: "What is a chatbot?",
      options: ["A robot that cleans houses", "A program that simulates human conversation", "A type of computer virus", "A social media app"],
      correct: 1,
      explanation: "A chatbot is a software application that uses AI to simulate human-like conversation through text or voice."
    },
    {
      q: "Which of these is a popular AI assistant?",
      options: ["Photoshop", "Siri", "Excel", "Chrome"],
      correct: 1,
      explanation: "Siri is Apple's AI-powered virtual assistant. The others are not AI assistants."
    },
    {
      q: "What does 'machine learning' mean?",
      options: ["Machines learning to walk", "Computers learning from data without being explicitly programmed", "Humans learning about machines", "Machines teaching humans"],
      correct: 1,
      explanation: "Machine Learning is a subset of AI where computers learn patterns from data and improve over time without explicit programming."
    },
    {
      q: "Which of these can AI do?",
      options: ["Recognize faces in photos", "Fly airplanes alone", "Read human minds", "Control the weather"],
      correct: 0,
      explanation: "AI can recognize faces in photos using computer vision. It cannot read minds or control weather."
    },
    {
      q: "What is 'Deep Learning' related to?",
      options: ["Swimming pools", "Neural networks with many layers", "Space exploration", "Oceanography"],
      correct: 1,
      explanation: "Deep Learning uses neural networks with many layers ('deep') to learn complex patterns in data."
    },
    {
      q: "Which language is most commonly used for AI development?",
      options: ["JavaScript", "Python", "HTML", "CSS"],
      correct: 1,
      explanation: "Python is the most popular language for AI due to its simplicity and powerful libraries like TensorFlow and PyTorch."
    },
    {
      q: "What is 'NLP' in AI?",
      options: ["Natural Language Processing", "Neural Learning Protocol", "Network Linking Process", "New Logic Programming"],
      correct: 0,
      explanation: "NLP (Natural Language Processing) helps computers understand, interpret, and respond to human language."
    },
    {
      q: "What is a 'robot' in simple terms?",
      options: ["A human in costume", "A machine that can be programmed to do tasks", "A type of software only", "A living organism"],
      correct: 1,
      explanation: "A robot is a programmable machine that can carry out a series of actions automatically."
    },
    {
      q: "Which AI beat the world champion at chess in 1997?",
      options: ["AlphaGo", "Watson", "Deep Blue", "Siri"],
      correct: 2,
      explanation: "IBM's Deep Blue defeated chess world champion Garry Kasparov in 1997."
    },
    {
      q: "What is 'computer vision'?",
      options: ["A monitor screen", "AI that helps computers 'see' and understand images", "A type of glasses", "A drawing software"],
      correct: 1,
      explanation: "Computer Vision is an AI field that enables computers to derive meaningful information from images and videos."
    },
    {
      q: "What is 'big data'?",
      options: ["Large computer screens", "Extremely large datasets that are hard to process", "A type of video game", "A social network"],
      correct: 1,
      explanation: "Big Data refers to extremely large datasets that require special tools and AI to analyze and extract insights."
    },
    {
      q: "Can AI make mistakes?",
      options: ["No, AI is perfect", "Yes, AI can make errors", "Only if it's turned off", "Only on weekends"],
      correct: 1,
      explanation: "Yes, AI can make mistakes. It depends on the quality of training data and the algorithm's limitations."
    },
    {
      q: "What is an 'algorithm'?",
      options: ["A type of robot", "A step-by-step procedure to solve a problem", "A musical instrument", "A computer brand"],
      correct: 1,
      explanation: "An algorithm is a set of step-by-step instructions designed to perform a specific task or solve a problem."
    }
  ];

  const teacherQuestions = [
    {
      q: "In the Transformer architecture, what is the primary purpose of the 'Multi-Head Attention' mechanism?",
      options: ["To reduce model size", "To allow the model to jointly attend to information from different representation subspaces", "To replace the need for positional encoding", "To perform gradient clipping"],
      correct: 1,
      explanation: "Multi-Head Attention allows the model to focus on different positions and representation subspaces simultaneously, capturing various types of relationships in the data."
    },
    {
      q: "What is the vanishing gradient problem most associated with?",
      options: ["Support Vector Machines", "Deep neural networks with sigmoid/tanh activations", "K-Nearest Neighbors", "Decision Trees"],
      correct: 1,
      explanation: "The vanishing gradient problem occurs in deep networks when gradients become extremely small during backpropagation, preventing early layers from learning. It's especially problematic with sigmoid/tanh activations."
    },
    {
      q: "Which optimization algorithm adapts the learning rate per parameter using estimates of first and second moments of the gradients?",
      options: ["SGD", "RMSprop", "Adam", "AdaGrad"],
      correct: 2,
      explanation: "Adam (Adaptive Moment Estimation) combines ideas from RMSprop and momentum, maintaining per-parameter learning rates based on estimates of first and second moments of gradients."
    },
    {
      q: "What is the primary difference between ELBO and KL divergence in Variational Autoencoders?",
      options: ["ELBO maximizes reconstruction error", "ELBO is a lower bound on the log-likelihood that includes reconstruction and regularization terms", "KL divergence is used only in GANs", "ELBO stands for Expected Bayesian Optimization"],
      correct: 1,
      explanation: "ELBO (Evidence Lower Bound) decomposes into reconstruction loss and KL divergence between the approximate posterior and prior. Maximizing ELBO is equivalent to minimizing reconstruction error while keeping the latent distribution close to the prior."
    },
    {
      q: "In GANs, what mode of failure occurs when the generator produces limited varieties of outputs?",
      options: ["Mode collapse", "Gradient explosion", "Underfitting", "Posterior collapse"],
      correct: 0,
      explanation: "Mode collapse occurs when the generator learns to produce a small subset of possible outputs that fool the discriminator, rather than capturing the full diversity of the real data distribution."
    },
    {
      q: "What is the primary architectural innovation of ResNet that enables training of very deep networks?",
      options: ["Batch Normalization only", "Skip connections (residual connections)", "Dilated convolutions", "Attention mechanisms"],
      correct: 1,
      explanation: "ResNet introduced skip (residual) connections that allow gradients to flow directly through the network, mitigating the vanishing gradient problem and enabling networks with hundreds or thousands of layers."
    },
    {
      q: "Which of these is a characteristic of 'few-shot learning'?",
      options: ["Requires millions of labeled examples", "Learns from very limited labeled examples", "Only works with image data", "Uses no neural networks"],
      correct: 1,
      explanation: "Few-shot learning aims to learn effective classifiers from only a handful of labeled examples per class, often using meta-learning or metric-based approaches."
    },
    {
      q: "What does 'BERT' use that GPT (original) does not?",
      options: ["Only decoder blocks", "Bidirectional context in pre-training", "Reinforcement learning", "Convolutional layers"],
      correct: 1,
      explanation: "BERT uses bidirectional transformers, meaning it considers both left and right context simultaneously during pre-training (via masked language modeling). Original GPT uses left-to-right (autoregressive) context only."
    },
    {
      q: "In reinforcement learning, what is the 'exploration vs exploitation' dilemma?",
      options: ["Choosing between CPU and GPU", "Balancing trying new actions vs using known rewarding actions", "Deciding batch size", "Selecting activation functions"],
      correct: 1,
      explanation: "The exploration-exploitation trade-off refers to balancing between exploring new actions to discover potentially better rewards, and exploiting known actions that already yield high rewards."
    },
    {
      q: "What is 'gradient checkpointing' used for?",
      options: ["Speeding up inference", "Reducing memory usage during training by recomputing activations", "Improving model accuracy", "Data augmentation"],
      correct: 1,
      explanation: "Gradient checkpointing trades computation for memory by not storing all intermediate activations during forward pass, instead recomputing them during backward pass when needed."
    },
    {
      q: "Which technique is used to prevent overfitting by randomly dropping units during training?",
      options: ["Batch Normalization", "Dropout", "L2 Regularization", "Early Stopping"],
      correct: 1,
      explanation: "Dropout randomly sets a fraction of input units to 0 at each update during training, which helps prevent neurons from co-adapting too much and reduces overfitting."
    },
    {
      q: "What is 'attention is all you need' referring to?",
      options: ["A paper that introduced the Transformer architecture", "A philosophy about human focus", "A CNN improvement technique", "A reinforcement learning algorithm"],
      correct: 0,
      explanation: "'Attention Is All You Need' (Vaswani et al., 2017) is the landmark paper that introduced the Transformer architecture, demonstrating that attention mechanisms alone could achieve state-of-the-art results without recurrence or convolution."
    },
    {
      q: "What is the curse of dimensionality in machine learning?",
      options: ["Too many programmers", "Data becomes sparse and distances lose meaning in high-dimensional spaces", "Slow internet connection", "Too much training data"],
      correct: 1,
      explanation: "The curse of dimensionality refers to phenomena that arise when analyzing data in high-dimensional spaces (often with hundreds or thousands of features) where data becomes sparse and distance metrics become less meaningful."
    },
    {
      q: "In a CNN, what does a 'kernel' or 'filter' do?",
      options: ["Stores the dataset", "Slides over input to detect features like edges or textures", "Normalizes the output", "Compresses the model"],
      correct: 1,
      explanation: "A kernel/filter is a small matrix that slides (convolves) over the input image to detect local features such as edges, corners, or textures at different levels of abstraction."
    },
    {
      q: "What is 'temperature scaling' used for in language models?",
      options: ["Cooling down GPUs", "Controlling the randomness/creativity of generated text", "Increasing model size", "Faster tokenization"],
      correct: 1,
      explanation: "Temperature scaling adjusts the probability distribution over tokens. Lower temperature (<1) makes output more deterministic/focused; higher temperature (>1) makes it more random/creative."
    }
  ];

  // ==================== STATE ====================
  let currentMode = 'student';
  let currentQuestion = 0;
  let score = 0;
  let answered = false;
  let currentQuestions = [];
  let currentShuffledOptions = [];

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('label-student').className = 'mode-label' + (mode === 'student' ? ' active' : '');
    document.getElementById('label-teacher').className = 'mode-label' + (mode === 'teacher' ? ' teacher-active' : '');
    const desc = mode === 'student'
      ? 'Test your AI knowledge with 15 medium-level questions. Options are shuffled every time!'
      : 'Challenge yourself with 15 tough AI questions for advanced learners. Options are shuffled every time!';
    document.getElementById('start-desc').textContent = desc;
  }

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestions() {
    currentQuestions = currentMode === 'student' ? [...studentQuestions] : [...teacherQuestions];
    currentQuestions = shuffleArray(currentQuestions);
  }

  function startQuiz() {
    currentQuestion = 0;
    score = 0;
    prepareQuestions();
    document.getElementById('quiz-start').style.display = 'none';
    document.getElementById('quiz-end').style.display = 'none';
    document.getElementById('quiz-game').style.display = 'block';
    showQuestion();
  }

  function showQuestion() {
    answered = false;
    const q = currentQuestions[currentQuestion];

    const originalCorrect = q.correct;
    const indexedOptions = q.options.map((text, idx) => ({ text, isCorrect: idx === originalCorrect }));
    const shuffled = shuffleArray(indexedOptions);
    currentShuffledOptions = shuffled;

    document.getElementById('question-text').textContent = q.q;
    document.getElementById('question-counter').textContent = `Question ${currentQuestion + 1} / ${currentQuestions.length}`;
    document.getElementById('progress-bar').style.width = `${((currentQuestion) / currentQuestions.length) * 100}%`;
    document.getElementById('feedback-box').className = 'feedback-box';
    document.getElementById('next-btn').style.display = 'none';

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    shuffled.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt.text}</span>`;
      btn.onclick = () => selectOption(idx);
      optionsList.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    if (answered) return;
    answered = true;
    const q = currentQuestions[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    buttons.forEach((btn, idx) => {
      btn.classList.add('disabled');
      if (currentShuffledOptions[idx].isCorrect) {
        btn.classList.add('correct');
      } else if (idx === selectedIdx && !currentShuffledOptions[idx].isCorrect) {
        btn.classList.add('wrong');
      }
    });

    if (currentShuffledOptions[selectedIdx].isCorrect) {
      score++;
      feedbackBox.className = 'feedback-box correct-feedback show';
      feedbackTitle.innerHTML = '<span style="color:var(--correct)">[ OK ]</span> CORRECT';
      feedbackText.textContent = 'Great job! You got it right.';
    } else {
      feedbackBox.className = 'feedback-box wrong-feedback show';
      feedbackTitle.innerHTML = '<span style="color:var(--wrong)">[ X ]</span> INCORRECT';
      feedbackText.textContent = q.explanation;
    }

    document.getElementById('next-btn').style.display = 'inline-block';
  }

  function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < currentQuestions.length) {
      showQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    document.getElementById('quiz-game').style.display = 'none';
    document.getElementById('quiz-end').style.display = 'block';
    document.getElementById('score-circle').textContent = `${score}/${currentQuestions.length}`;

    let message = '';
    let sub = '';
    const pct = score / currentQuestions.length;
    if (pct === 1) {
      message = 'PERFECT SCORE';
      sub = currentMode === 'teacher' ? 'You are an AI research master!' : 'Outstanding! You nailed every question.';
    } else if (pct >= 0.8) {
      message = 'EXCELLENT';
      sub = currentMode === 'teacher' ? 'Deep expertise shown.' : 'Strong understanding of AI concepts.';
    } else if (pct >= 0.5) {
      message = 'GOOD JOB';
      sub = 'Keep learning — you are getting there!';
    } else {
      message = 'KEEP PRACTICING';
      sub = 'Review the explanations and try again.';
    }
    document.getElementById('score-message').textContent = message;
    document.getElementById('score-sub').textContent = sub;
  }

  function restartQuiz() {
    startQuiz();
  }
</script>

</body>
</html>
